<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | College Club</title>
    <meta name="description" content="Register as a student member of our college club.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Join Our College Club</h1><p>Become a part of our community!</p></header>
<nav>
    <a href="index.html">Home</a><a href="about.html">About</a>
    <a href="registration.html">Registration</a><a href="contact.html">Contact</a>
</nav>
<main>
    <h2>Student Registration Form</h2>
    <p>Fill in your details to register for club membership.</p>
    <form action="#" method="get">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select your course</option>
            <option value="BTech">B.Tech</option><option value="BSc">B.Sc.</option>
            <option value="BCom">B.Com.</option><option value="BA">B.A.</option>
            <option value="Other">Other</option>
        </select>
        <label for="year">Study Year:</label>
        <select id="year" name="year" required>
            <option value="">Select your year</option>
            <option value="1">First Year</option><option value="2">Second Year</option>
            <option value="3">Third Year</option><option value="4">Fourth Year</option>
        </select>
        <label for="interest">Area of Interest:</label>
        <select id="interest" name="interest" required>
            <option value="">Choose an activity</option>
            <option value="Coding">Coding</option><option value="Cultural">Cultural Activities</option>
            <option value="Sports">Sports</option><option value="Events">Event Management</option>
        </select>
        <label for="reason">Why do you want to join?</label>
        <textarea id="reason" name="reason" rows="4" placeholder="Tell us about your interests" required></textarea>
        <button type="submit">Register Now</button>
    </form>
</main>
<footer><p>&copy; 2026 College Club | All Rights Reserved</p></footer>
</body>
</html>
